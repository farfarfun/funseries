[project]
name = "funseries"
version = "0.0.17"
description = "funseries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["funbuild", "sqlalchemy"]
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "牛哥"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funseries"
Releases = "https://github.com/farfarfun/funseries/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funseries"]
