[project]
name = "funseries"
version = "0.0.17"
description = "素数判定、Miller-Rabin 概率检验与素数生成算法实验包"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "牛哥"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funseries"
Releases = "https://github.com/farfarfun/funseries/releases"

[dependency-groups]
dev = ["funbuild>=1.6.66", "pytest>=8.0.0", "ruff>=0.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funseries"]

[tool.ruff]
target-version = "py310"
